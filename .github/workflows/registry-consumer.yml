name: Official npm consumer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Isolate public registry configuration
        run: |
          : > "$RUNNER_TEMP/user.npmrc"
          : > "$RUNNER_TEMP/global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_REGISTRY=https://registry.npmjs.org/" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:public
      - run: pnpm build
